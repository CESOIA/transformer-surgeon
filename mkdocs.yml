site_name: TransformerSurgeon
site_description: HuggingFace model compression and export framework
repo_url: https://github.com/CESOIA/transformer-surgeon
repo_name: transformer-surgeon

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Pipeline: pipeline.md
  - Folders:
    - utils: folders/utils.md
    - models: folders/models.md
    - compression: folders/compression.md
    - calibration: folders/calibration.md
    - blocks: folders/blocks.md
    - export: folders/export.md
  - How to add…: recipes.md
  - Compression Methods: compression_methods.md
  - Examples:
    - Basic LRD: examples/01_basic_lrd.md
    - Calibrated LRD (SVD-LLM-v2): examples/02_calibrated_lrd_svd_llm_v2.md
    - HF Export Roundtrip: examples/03_hf_export_roundtrip.md
    - KV-cache interfaces: examples/04_cache_impl_export_interface.md
  - API Reference:
    - utils: api/utils.md
    - models: api/models.md
    - compression: api/compression.md
    - calibration: api/calibration.md
    - blocks: api/blocks.md
    - export: api/export.md
    - hf: api/hf.md

not_in_nav: |
  generated/*

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true
